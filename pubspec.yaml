name: anchored_menu
description: "A lightweight Flutter anchored popup menu with recursive card-style submenus, controlled selection, and customizable theming."
version: 0.1.1
repository: https://github.com/LumiDesk/anchored_menu
issue_tracker: https://github.com/LumiDesk/anchored_menu/issues
topics:
  - flutter
  - menu
  - navigation
  - widgets
  - ui
screenshots:
  - description: An anchored menu opened from a header action.
    path: doc/screenshots/menu-dark.png
  - description: A nested menu card with a selected item.
    path: doc/screenshots/submenu-dark.png

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.2"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
